serviceAuth:
  clientId: platform_backend
  clientSecret: secret
  tokenEndpoint: http://hydra-public:4444/oauth2/token
  scope: MEASUREMENT.CREATE MEASUREMENT.READ SUBJECT.READ PROJECT.READ
  audience: res_gateway

gateway:
  baseUrl: "http://radar-gateway:8090/radar-gateway"
  timeout: 30
  maxRetries: 3

server:
  baseUri: "http://0.0.0.0:8085"
  requestTimeout: 30
  isJmxEnabled: false

logging:
  level: "INFO"
  file: "logs/gateway-service.log"
  pattern: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
